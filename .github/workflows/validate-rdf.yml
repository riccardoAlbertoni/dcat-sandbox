name: Validate DCAT RDF

# Run validation for pull requests and pushes that change the canonical source.
on:
  pull_request:
    paths:
      - "dcat/rdf/dcat3.ttl"
  push:
    paths:
      - "dcat/rdf/dcat3.ttl"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit being validated.
      - uses: actions/checkout@v5
      # Jena 6.2.0 requires Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Install the pinned Jena release used for reproducible output.
      - name: Install Apache Jena
        run: |
          curl --fail --silent --show-error --location \
            https://archive.apache.org/dist/jena/binaries/apache-jena-6.2.0.tar.gz \
            | tar -xz
          echo "$PWD/apache-jena-6.2.0/bin" >> "$GITHUB_PATH"
      # Validate Turtle and verify that both derived graphs are equivalent.
      - name: Generate and validate serializations
        run: scripts/generate-rdf.sh
