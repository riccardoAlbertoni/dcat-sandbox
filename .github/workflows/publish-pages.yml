name: Publish GitHub Pages

# Generate and deploy only the merge result that reaches gh-pages.
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  # Pages deployment needs read access, artifact publishing, and OIDC.
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep only the newest publication when several gh-pages pushes arrive.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build the site from the merged gh-pages commit.
      - uses: actions/checkout@v5
      # Jena 6.2.0 requires Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Install the same pinned Jena release used by validation.
      - name: Install Apache Jena
        run: |
          curl --fail --silent --show-error --location \
            https://archive.apache.org/dist/jena/binaries/apache-jena-6.2.0.tar.gz \
            | tar -xz
          echo "$PWD/apache-jena-6.2.0/bin" >> "$GITHUB_PATH"
      # Copy the site and generate JSON-LD/RDF/XML from dcat3.ttl.
      - name: Build publication site
        run: scripts/build-publication.sh "$RUNNER_TEMP/site"
      # Pass the complete generated site to the deployment job.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # GitHub Pages exposes the resulting deployment URL here.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish the artifact uploaded by the build job.
      - id: deployment
        uses: actions/deploy-pages@v5
